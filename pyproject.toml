[project]
name = "ha-philips-airfan"
version = "1.0.0"
description = "Philips Air Fan integration for Home Assistant"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
